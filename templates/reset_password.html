<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizPulse | Choose a new password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="auth-page">
    <a class="brand" href="{{ url_for('index') }}">
        <div class="brand-mark">B</div>
        <div>
            <h1>BizPulse</h1>
            <span>Business intelligence, simplified</span>
        </div>
    </a>

    <section class="auth-card">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h2>Choose a new password</h2>
        <p class="muted">Use at least eight characters.</p>

        <div id="resetError" class="message error" hidden></div>
        <div id="resetMessage" class="message success" hidden></div>

        <form id="resetForm" class="auth-form">
            <label>
                New password
                <input id="newPassword" type="password"
                       autocomplete="new-password" minlength="8" required>
            </label>
            <label>
                Confirm password
                <input id="confirmPassword" type="password"
                       autocomplete="new-password" minlength="8" required>
            </label>
            <button type="submit" class="primary-button">Update password</button>
        </form>
    </section>
</main>

<script>
    const supabaseClient = window.supabase.createClient(
        {{ supabase_config.url | tojson }},
        {{ supabase_config.publishable_key | tojson }}
    );
    const form = document.getElementById("resetForm");
    const errorBox = document.getElementById("resetError");
    const messageBox = document.getElementById("resetMessage");

    function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
        messageBox.hidden = true;
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();
        const password = document.getElementById("newPassword").value;
        const confirmation = document.getElementById("confirmPassword").value;

        if (password.length < 8 || password !== confirmation) {
            showError("Passwords must match and be at least 8 characters.");
            return;
        }

        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) {
            showError(error.message);
            return;
        }

        form.hidden = true;
        messageBox.textContent = "Password updated. You can now sign in.";
        messageBox.hidden = false;
        setTimeout(() => {
            window.location.href = "{{ url_for('auth_login') }}";
        }, 1200);
    });
</script>
</body>
</html>
