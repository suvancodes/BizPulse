<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizPulse | Reset password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="auth-page">
    <a class="brand" href="{{ url_for('index') }}">
        <div class="brand-mark">B</div>
        <div>
            <h1>BizPulse</h1>
            <span>Business intelligence, simplified</span>
        </div>
    </a>

    <section class="auth-card">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h2>Reset your password</h2>
        <p class="muted">We will email you a secure password reset link.</p>

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}
        {% if message %}
            <div class="message success">{{ message }}</div>
        {% endif %}

        <form method="post" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label>
                Email
                <input type="email" name="email" value="{{ email or '' }}"
                       autocomplete="email" required>
            </label>
            <button type="submit" class="primary-button">Send reset link</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('auth_login') }}">Back to sign in</a>
        </div>
    </section>
</main>
</body>
</html>
