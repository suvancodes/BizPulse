<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizPulse Inventory Upload</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="upload-page">
        <section class="upload-card">
            <p class="eyebrow">INVENTORY ANALYTICS</p>
            <h1>Upload inventory files</h1>
            <p class="muted">
                Upload both files to calculate stock levels and stockout risks.
            </p>

            {% if error %}
                <div class="message error">{{ error }}</div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                <label class="file-field">
                    <strong>products.csv</strong>
                    <span>Required: product_id, product_name</span>
                    <input type="file" name="products" accept=".csv" required>
                </label>

                <label class="file-field">
                    <strong>inventory.csv</strong>
                    <span>
                        Required: product_id, date, stock_quantity,
                        reorder_level
                    </span>
                    <input type="file" name="inventory" accept=".csv" required>
                </label>

                <button type="submit">Analyze inventory</button>
            </form>

            <a class="text-button" href="/upload">
                ← Upload all business files
            </a>
        </section>
    </main>
</body>
</html>
